<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Andy vs Tikus - Smooth Animated</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            text-align: center;
            background: #1b5e20;
            border: 3px solid #ffffff;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
        }
        .ui-panel {
            display: flex;
            justify-content: space-between;
            width: 320px;
            margin: 0 auto 10px auto;
            font-size: 16px;
            font-weight: bold;
        }
        canvas {
            background: #388e3c;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h3 style="margin: 5px 0 10px 0;">🧹 Andy vs Tikus (Animated)</h3>
        <div class="ui-panel">
            <span id="score-text">Skor: 0</span>
            <span id="status-text" style="color: #ffeb3b;">Siap!</span>
        </div>
        <canvas id="gameCanvas" width="320" height="420"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreText = document.getElementById('score-text');
        const statusText = document.getElementById('status-text');

        // MEMUAT SPRITE SHEET 5 KOLOM x 2 BARIS (10 FRAME)
        const spriteSheet = new Image();
        spriteSheet.src = 'tikus_spritesheet.png'; 

        const SPRITE_COLS = 5;      // 5 Kolom
        const SPRITE_ROWS = 2;      // 2 Baris
        const TOTAL_FRAMES = 10;    // Total 10 Frame Animasi
        
        let currentFrame = 0;
        let lastFrameTime = 0;
        const frameInterval = 70;   // Kecepatan animasi (~14 FPS)

        let score = 0;
        let gameActive = true;

        const holes = [
            { x: 80, y: 100 },
            { x: 240, y: 100 },
            { x: 80, y: 210 },
            { x: 240, y: 210 },
            { x: 80, y: 320 },
            { x: 240, y: 320 }
        ];

        let currentRat = {
            holeIndex: -1,
            timer: null,
            escapeTime: 650
        };

        function spawnRat() {
            if (!gameActive) return;

            let newHole;
            do {
                newHole = Math.floor(Math.random() * holes.length);
            } while (newHole === currentRat.holeIndex);

            currentRat.holeIndex = newHole;

            currentRat.escapeTime = Math.max(350, 650 - Math.floor(score / 50) * 40);
            statusText.innerText = "CEPAT! 🐭";

            clearTimeout(currentRat.timer);
            currentRat.timer = setTimeout(() => {
                if (currentRat.holeIndex !== -1) {
                    statusText.innerText = "KABUR! 😜";
                    currentRat.holeIndex = -1;
                    setTimeout(spawnRat, 120);
                }
            }, currentRat.escapeTime);
        }

        // Interaksi Sentuh (Tap HP)
        canvas.addEventListener('pointerdown', function(event) {
            if (!gameActive || currentRat.holeIndex === -1) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;

            const targetHole = holes[currentRat.holeIndex];
            const distance = Math.hypot(clickX - targetHole.x, clickY - targetHole.y);

            if (distance < 45) {
                clearTimeout(currentRat.timer);
                score += 10;
                scoreText.innerText = "Skor: " + score;
                statusText.innerText = "POW! 💥";

                currentRat.holeIndex = -1;
                setTimeout(spawnRat, 100);
            }
        });

        // GAME LOOP (PENGGERAK ANIMASI 60 FPS)
        function gameLoop(timestamp) {
            if (timestamp - lastFrameTime > frameInterval) {
                currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
                lastFrameTime = timestamp;
            }

            drawGame();
            requestAnimationFrame(gameLoop);
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Lapangan Rumput
            ctx.fillStyle = '#2e7d32';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Gambar 6 Lubang
            holes.forEach((hole, index) => {
                ctx.beginPath();
                ctx.arc(hole.x, hole.y, 35, 0, Math.PI * 2);
                ctx.fillStyle = '#1b5e20';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#000000';
                ctx.stroke();

                // RENDERING SPRITE ANIMASI
                if (index === currentRat.holeIndex) {
                    if (spriteSheet.complete && spriteSheet.naturalWidth !== 0) {
                        const frameWidth = spriteSheet.naturalWidth / SPRITE_COLS;
                        const frameHeight = spriteSheet.naturalHeight / SPRITE_ROWS;

                        const col = currentFrame % SPRITE_COLS;
                        const row = Math.floor(currentFrame / SPRITE_COLS);

                        const srcX = col * frameWidth;
                        const srcY = row * frameHeight;

                        ctx.drawImage(
                            spriteSheet,
                            srcX, srcY, frameWidth, frameHeight,
                            hole.x - 35, hole.y - 40, 70, 70
                        );
                    } else {
                        // Cadangan jika sprite belum ter-load
                        ctx.fillStyle = '#ffb74d';
                        ctx.beginPath();
                        ctx.arc(hole.x, hole.y - 5, 25, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    }
                }
            });
        }

        spawnRat();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
