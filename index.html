<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreText = document.getElementById('score-text');
    const statusText = document.getElementById('status-text');

    let score = 0;
    let gameActive = true;

    // Posisi 6 Lubang Tikus
    const holes = [
        { x: 90, y: 120 },
        { x: 270, y: 120 },
        { x: 90, y: 240 },
        { x: 270, y: 240 },
        { x: 90, y: 360 },
        { x: 270, y: 360 }
    ];

    let currentRat = {
        holeIndex: -1,
        hp: 1,           // Mode cepat: 1x tap langsung K.O.!
        timer: null,
        escapeTime: 700  // AWAL: 0,7 detik (di bawah 1 detik!)
    };

    function spawnRat() {
        if (!gameActive) return;

        // Pilih lubang acak
        let newHole;
        do {
            newHole = Math.floor(Math.random() * holes.length);
        } while (newHole === currentRat.holeIndex);

        currentRat.holeIndex = newHole;
        currentRat.hp = 1; 

        // HITUNG KECEPATAN DINAMIS: Makin tinggi skor, makin ngebut!
        // Batas paling cepat adalah 350ms (0,35 detik)
        currentRat.escapeTime = Math.max(350, 700 - Math.floor(score / 50) * 50);

        statusText.innerText = "Status: CEPAT! 🐭";

        // Timer kabur instan jika pemain lambat
        clearTimeout(currentRat.timer);
        currentRat.timer = setTimeout(() => {
            if (currentRat.hp > 0) {
                statusText.innerText = "Status: KETINGGALAN! 😜";
                currentRat.holeIndex = -1;
                drawGame();
                // Jeda spawn super singkat (0,15 detik)
                setTimeout(spawnRat, 150); 
            }
        }, currentRat.escapeTime);

        drawGame();
    }

    // Interaksi Tap Instan (Refleks Cepat)
    canvas.addEventListener('pointerdown', function(event) { // Pakai pointerdown agar lebih reaktif dari 'click'
        if (!gameActive || currentRat.holeIndex === -1) return;

        const rect = canvas.getBoundingClientRect();
        const clickX = event.clientX - rect.left;
        const clickY = event.clientY - rect.top;

        const targetHole = holes[currentRat.holeIndex];
        const distance = Math.hypot(clickX - targetHole.x, clickY - targetHole.y);

        if (distance < 50) { // Area tap dibuat sedikit lebih luas agar nyaman di HP
            clearTimeout(currentRat.timer);
            score += 10;
            scoreText.innerText = "Skor: " + score;
            statusText.innerText = "Status: POW! PERFEK 💥";
            
            currentRat.holeIndex = -1;
            drawGame();

            // Langsung panggil tikus baru dalam 0,1 detik!
            setTimeout(spawnRat, 100);
        }
    });

    function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Rumput
        ctx.fillStyle = '#2e7d32';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Lubang
        holes.forEach((hole, index) => {
            ctx.beginPath();
            ctx.arc(hole.x, hole.y, 38, 0, Math.PI * 2);
            ctx.fillStyle = '#1b5e20';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#000000';
            ctx.stroke();

            // Tikus
            if (index === currentRat.holeIndex) {
                ctx.fillStyle = '#ffb74d';
                ctx.beginPath();
                ctx.arc(hole.x, hole.y - 5, 28, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Mata
                ctx.fillStyle = '#000';
                ctx.fillRect(hole.x - 10, hole.y - 12, 6, 6);
                ctx.fillRect(hole.x + 4, hole.y - 12, 6, 6);
            }
        });
    }

    spawnRat();
</script>
