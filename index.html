<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Andy vs Tikus - Combo Beatdown</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            text-align: center;
            background: #1b5e20;
            border: 3px solid #ffffff;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
        }
        .ui-panel {
            display: flex;
            justify-content: space-between;
            width: 330px;
            margin: 0 auto 10px auto;
            font-size: 16px;
            font-weight: bold;
        }
        canvas {
            background: #388e3c;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h3 style="margin: 5px 0 10px 0;">🧹 Andy vs Tikus (Combo Beatdown)</h3>
        <div class="ui-panel">
            <span id="score-text">Skor: 0</span>
            <span id="status-text" style="color: #ffeb3b;">Incar Tikus! 🐭</span>
        </div>
        <canvas id="gameCanvas" width="340" height="440"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreText = document.getElementById('score-text');
        const statusText = document.getElementById('status-text');

        // SPRITE SHEET 1: Tikus Lari/Muncul (5x2 grid)
        const spriteRun = new Image();
        spriteRun.src = 'tikus_spritesheet.png';

        // SPRITE SHEET 2: Tikus Dipukuli/Kesakitan (5x2 grid)
        const spriteHit = new Image();
        spriteHit.src = 'tikus_pukuli.png'; 

        const COLS = 5;
        const ROWS = 2;
        const TOTAL_FRAMES = 10;
        
        let currentFrame = 0;
        let lastFrameTime = 0;
        const frameInterval = 70; // Kecepatan putar animasi (~14 FPS)

        let score = 0;
        let gameActive = true;

        // UKURAN IKON TIKUS
        const RUN_SIZE = 95;   // Ukuran saat lari (diperbesar)
        const HIT_SIZE = 155;  // Ukuran RAKSASA saat dipukuli (puas dilihat!)

        const holes = [
            { x: 85, y: 100 },
            { x: 255, y: 100 },
            { x: 85, y: 220 },
            { x: 255, y: 220 },
            { x: 85, y: 340 },
            { x: 255, y: 340 }
        ];

        let currentRat = {
            holeIndex: -1,
            state: 'NONE', // 'RUNNING', 'STUNNED', 'TAUNT', 'DEAD'
            tapsCount: 0,
            tapsRequired: 10, // Butuh 5x pukulan untuk menumbangkan tikus
            escapeTimer: null,
            stunTimer: null,
            escapeTime: 700
        };

        function spawnRat() {
            if (!gameActive) return;

            let newHole;
            do {
                newHole = Math.floor(Math.random() * holes.length);
            } while (newHole === currentRat.holeIndex);

            currentRat.holeIndex = newHole;
            currentRat.state = 'RUNNING';
            currentRat.tapsCount = 0;

            // Kecepatan lari makin cepat seiring bertambahnya skor
            currentRat.escapeTime = Math.max(300, 700 - Math.floor(score / 50) * 45);
            statusText.innerText = "INCAR TIKUS! 🐭";
            statusText.style.color = "#ffeb3b";

            clearTimeout(currentRat.escapeTimer);
            clearTimeout(currentRat.stunTimer);

            currentRat.escapeTimer = setTimeout(() => {
                if (currentRat.state === 'RUNNING') {
                    statusText.innerText = "KABUR! 💨";
                    currentRat.holeIndex = -1;
                    currentRat.state = 'NONE';
                    setTimeout(spawnRat, 150);
                }
            }, currentRat.escapeTime);
        }

        // TANGPAN SENTUHAN / TAP PEMAIN
        canvas.addEventListener('pointerdown', function(event) {
            if (!gameActive || currentRat.holeIndex === -1) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;

            const targetHole = holes[currentRat.holeIndex];
            
            // Hitbox melebar saat tikus berukuran raksasa
            const hitRadius = (currentRat.state === 'STUNNED') ? 70 : 50;
            const distance = Math.hypot(clickX - targetHole.x, clickY - targetHole.y);

            if (distance < hitRadius) {
                if (currentRat.state === 'RUNNING') {
                    // PUKULAN PERTAMA: KUNCI TIKUS (STUN)
                    clearTimeout(currentRat.escapeTimer);
                    currentRat.state = 'STUNNED';
                    currentRat.tapsCount = 1;
                    score += 10;
                    scoreText.innerText = "Skor: " + score;

                    statusText.innerText = `KUNCI! PUKUL! 🥊 (1/${currentRat.tapsRequired})`;
                    statusText.style.color = "#ff9800";

                    startStunWindow();

                } else if (currentRat.state === 'STUNNED') {
                    // PUKULAN BERUNTUN (COMBO dalam 1 Detik)
                    clearTimeout(currentRat.stunTimer); // Reset hitungan 1 detik
                    currentRat.tapsCount++;
                    score += 15;
                    scoreText.innerText = "Skor: " + score;

                    if (currentRat.tapsCount >= currentRat.tapsRequired) {
                        // TIKUS MATI / FINISHED!
                        currentRat.state = 'DEAD';
                        score += 50; // Bonus Kill
                        scoreText.innerText = "Skor: " + score;
                        statusText.innerText = "MODAR! 💥💀";
                        statusText.style.color = "#f44336";

                        setTimeout(() => {
                            currentRat.holeIndex = -1;
                            currentRat.state = 'NONE';
                            setTimeout(spawnRat, 200);
                        }, 400);
                    } else {
                        statusText.innerText = `HAJAR TRUS! 💥 (${currentRat.tapsCount}/${currentRat.tapsRequired})`;
                        startStunWindow(); // Mulai ulang timer 1 detik
                    }
                }
            }
        });

        // WAKTU TIKUS TERKUNCI (1 DETIK)
        function startStunWindow() {
            clearTimeout(currentRat.stunTimer);
            currentRat.stunTimer = setTimeout(() => {
                // Jika pemain terlalu lambat (jeda > 1 detik)
                if (currentRat.state === 'STUNNED') {
                    currentRat.state = 'TAUNT';
                    statusText.innerText = "NGEJEK! 😜 WLEE~";
                    statusText.style.color = "#e91e63";

                    setTimeout(() => {
                        currentRat.holeIndex = -1;
                        currentRat.state = 'NONE';
                        setTimeout(spawnRat, 300);
                    }, 700);
                }
            }, 1000); // Window 1 detik untuk pukulan berikutnya
        }

        // GAME LOOP (60 FPS)
        function gameLoop(timestamp) {
            if (timestamp - lastFrameTime > frameInterval) {
                currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
                lastFrameTime = timestamp;
            }

            drawGame();
            requestAnimationFrame(gameLoop);
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Lapangan Rumput
            ctx.fillStyle = '#2e7d32';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Gambar 6 Lubang
            holes.forEach((hole, index) => {
                ctx.beginPath();
                ctx.arc(hole.x, hole.y, 40, 0, Math.PI * 2);
                ctx.fillStyle = '#1b5e20';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#000000';
                ctx.stroke();

                // RENDERING ANIMASI TIKUS
                if (index === currentRat.holeIndex) {
                    
                    // STATUS 1: Tikus Berlarian (Pakai Sprite 1 - tikus_spritesheet.png)
                    if (currentRat.state === 'RUNNING') {
                        renderSprite(spriteRun, hole.x, hole.y, RUN_SIZE);
                    } 
                    // STATUS 2 & DEAD: Tikus Dipukuli (Pakai Sprite 2 - tikus_pukuli.png - RAKSASA)
                    else if (currentRat.state === 'STUNNED' || currentRat.state === 'DEAD') {
                        renderSprite(spriteHit, hole.x, hole.y, HIT_SIZE);
                    } 
                    // STATUS 3: Tikus Mengejek (Lolos)
                    else if (currentRat.state === 'TAUNT') {
                        ctx.fillStyle = '#ffeb3b';
                        ctx.font = 'bold 22px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('😜 WLEEE~', hole.x, hole.y - 10);
                    }
                }
            });
        }

        function renderSprite(imgObj, x, y, size) {
            if (imgObj.complete && imgObj.naturalWidth !== 0) {
                const frameWidth = imgObj.naturalWidth / COLS;
                const frameHeight = imgObj.naturalHeight / ROWS;

                const col = currentFrame % COLS;
                const row = Math.floor(currentFrame / COLS);

                const srcX = col * frameWidth;
                const srcY = row * frameHeight;

                // Render gambar tepat di tengah lubang
                ctx.drawImage(
                    imgObj,
                    srcX, srcY, frameWidth, frameHeight,
                    x - (size / 2), y - (size / 2), size, size
                );
            } else {
                // Cadangan jika sprite belum ter-load
                ctx.fillStyle = '#ffb74d';
                ctx.beginPath();
                ctx.arc(x, y - 5, 30, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        spawnRat();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
